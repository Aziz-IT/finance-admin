<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance admin · لوحة المالية</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e6e9f2; --hover:#f7f8fc;
    --side:#0f172a; --side-2:#1e293b; --side-text:#94a3b8;
    --accent:#4f46e5; --accent-2:#7c3aed; --ok:#059669; --warn:#d97706; --danger:#dc2626; --debt:#e11d48; --save:#059669;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06); --radius:14px;
  }
  [data-theme="dark"] {
    --bg:#0b1020; --card:#131a2b; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a3d; --hover:#182238;
    --side:#070b16; --side-2:#131c30; --side-text:#8592a8;
    --accent:#818cf8; --accent-2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --debt:#fb7185; --save:#34d399;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1020; --card:#131a2b; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a3d; --hover:#182238; --side:#070b16; --side-2:#131c30; --side-text:#8592a8; --accent:#818cf8; --accent-2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --debt:#fb7185; --save:#34d399; --shadow:0 1px 2px rgba(0,0,0,.4); } }

  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; -webkit-font-smoothing:antialiased; }
  input,select,textarea,button { font:inherit; color:inherit; }
  input,select,textarea { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%; transition:border-color .15s, box-shadow .15s; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea { resize:vertical; min-height:64px; }
  button { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 14px; cursor:pointer; transition:all .15s; font-weight:500; }
  button:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff; box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.primary:hover { filter:brightness(1.06); }
  button.ghost { background:transparent; border-color:transparent; color:var(--muted); }
  button.ghost:hover { color:var(--text); background:var(--hover); }
  button.danger { color:var(--danger); }
  button.small { padding:5px 10px; font-size:13px; border-radius:8px; }

  aside { width:248px; background:linear-gradient(180deg,var(--side),var(--side-2)); color:var(--side-text); padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:3px; flex-shrink:0; overflow-y:auto; }
  .brand { display:flex; align-items:center; gap:10px; color:#fff; font-weight:700; font-size:16px; padding:4px 10px 22px; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:grid; place-items:center; color:#fff; font-size:15px; font-weight:800; }
  .nav-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#64748b; padding:14px 12px 6px; }
  .nav { display:flex; align-items:center; gap:10px; width:100%; text-align:start; background:none; border:none; color:var(--side-text); padding:10px 12px; border-radius:10px; font-weight:500; }
  .nav:hover { background:rgba(255,255,255,.06); border-color:transparent; color:#fff; }
  .nav.on { background:rgba(129,140,248,.18); color:#fff; }
  .nav .ic { width:18px; text-align:center; }
  .side-foot { margin-top:auto; font-size:12px; color:#64748b; padding:12px; line-height:1.5; }

  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 32px; background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .topbar h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  .topbar .date { color:var(--muted); font-size:13px; }
  .topbar .right { display:flex; gap:8px; align-items:center; }
  .content { padding:28px 32px 48px; max-width:1280px; width:100%; }
  h2 { font-size:16px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  .muted { color:var(--muted); font-size:13px; }
  .over { color:var(--danger) !important; }
  .good { color:var(--ok) !important; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:22px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
  .kpi .label { color:var(--muted); font-size:13px; font-weight:500; }
  .kpi .value { font-size:26px; font-weight:700; margin-top:8px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .kpi .hint { color:var(--muted); font-size:12px; margin-top:6px; }

  .grid2 { display:grid; grid-template-columns:1.5fr 1fr; gap:18px; margin-bottom:22px; }
  @media (max-width:1000px){ .grid2{grid-template-columns:1fr;} }

  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:22px; }
  .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .panel-body { padding:18px 20px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:start; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:var(--hover); }
  tbody tr:hover { background:var(--hover); }
  tbody tr:last-child td { border-bottom:none; }
  td.num,th.num { text-align:end; font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .avatar { width:32px; height:32px; border-radius:10px; display:inline-grid; place-items:center; font-weight:700; font-size:12px; color:#fff; margin-inline-end:10px; flex-shrink:0; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
  .name { display:inline-flex; align-items:center; font-weight:600; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--hover); color:var(--muted); }
  .b-ok { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
  .b-replan { background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
  .b-short { background:color-mix(in srgb,var(--danger) 14%,transparent); color:var(--danger); }
  .b-debt { background:color-mix(in srgb,var(--debt) 14%,transparent); color:var(--debt); }
  .b-oblig { background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
  .b-budget { background:color-mix(in srgb,var(--accent-2) 15%,transparent); color:var(--accent-2); }
  .empty { padding:36px 20px; text-align:center; color:var(--muted); font-size:14px; }

  .alert { border-radius:12px; padding:12px 16px; font-size:14px; margin-bottom:12px; border:1px solid; display:flex; gap:10px; align-items:flex-start; line-height:1.5; }
  .alert.warn { border-color:color-mix(in srgb,var(--warn) 45%,transparent); color:var(--warn); background:color-mix(in srgb,var(--warn) 9%,transparent); }
  .alert.bad { border-color:color-mix(in srgb,var(--danger) 45%,transparent); color:var(--danger); background:color-mix(in srgb,var(--danger) 9%,transparent); }
  .alert.ok { border-color:color-mix(in srgb,var(--ok) 45%,transparent); color:var(--ok); background:color-mix(in srgb,var(--ok) 9%,transparent); }
  .alert .txt { color:var(--text); }

  .progress { height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .progress > div { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s; }
  .debt-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; padding:18px 20px; }
  .debt-card { border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--card); display:grid; gap:12px; }
  .debt-card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .debt-card .owed { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .debt-card .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }

  .chart { width:100%; height:auto; }
  .chart .axis { stroke:var(--line); }
  .chart .tick { fill:var(--muted); font-size:11px; }
  .chart .line { fill:none; stroke-width:2.5; stroke-linejoin:round; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:10px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-inline-end:6px; vertical-align:middle; }

  .bar-row { display:grid; grid-template-columns:120px 1fr 110px; gap:12px; align-items:center; margin-bottom:14px; font-size:13px; }
  .bar-track { background:var(--line); border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; }
  .bar-val { text-align:end; font-variant-numeric:tabular-nums; font-weight:600; }

  .notes { display:grid; gap:10px; }
  .note { display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.5; padding:12px 14px; border-radius:10px; background:var(--hover); }
  .note .m { font-weight:700; min-width:72px; }

  dialog { border:1px solid var(--line); border-radius:16px; padding:0; background:var(--card); color:var(--text); width:min(520px,92vw); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(15,23,42,.5); backdrop-filter:blur(2px); }
  form.dlg { padding:22px; display:grid; gap:14px; }
  label { display:grid; gap:6px; font-size:13px; color:var(--muted); font-weight:500; }
  .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .error { color:var(--danger); font-size:13px; min-height:1em; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; padding:20px; max-width:680px; }
  .form-grid .full { grid-column:1/-1; }
  .control { display:flex; gap:10px; align-items:end; flex-wrap:wrap; padding:18px 20px; }
  .control label { min-width:200px; }

  .toasts { position:fixed; bottom:20px; inset-inline-end:20px; display:grid; gap:8px; z-index:50; }
  .toast { background:#0f172a; color:#fff; padding:12px 16px; border-radius:10px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); }

  @media (max-width:820px){
    body{flex-direction:column;}
    aside{width:100%; height:auto; position:static; flex-direction:row; flex-wrap:wrap; padding:10px; gap:4px;}
    .brand,.side-foot,.nav-label{display:none;}
    .nav{width:auto; padding:8px 10px; font-size:14px;}
    .content{padding:18px;}
    .topbar{padding:14px 18px;}
    .form-grid{grid-template-columns:1fr;}
    .bar-row{grid-template-columns:90px 1fr 90px;}
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="logo">F</span>Finance admin</div>
  <div class="nav-label">Overview</div>
  <button class="nav" data-page="overview"><span class="ic">◉</span>Dashboard</button>
  <button class="nav" data-page="plan"><span class="ic">↗</span>Yearly plan</button>
  <div class="nav-label">Manage</div>
  <button class="nav" data-page="income"><span class="ic">$</span>Income · الدخل</button>
  <button class="nav" data-page="debts"><span class="ic">▣</span>Debts · الديون</button>
  <button class="nav" data-page="payments"><span class="ic">✓</span>Payments · الدفعات</button>
  <button class="nav" data-page="lent"><span class="ic">↩</span>Lent money · المال المقرض</button>
  <button class="nav" data-page="obligations"><span class="ic">▤</span>Obligations · الالتزامات</button>
  <button class="nav" data-page="budget"><span class="ic">◐</span>Budget · الميزانية</button>
  <div class="nav-label">App</div>
  <button class="nav" data-page="settings"><span class="ic">⚙</span>Settings · الإعدادات</button>
  <div class="side-foot">Your data stays in this browser.<br>Export a backup regularly.</div>
</aside>

<main>
  <header class="topbar">
    <div>
      <h1 id="title">Dashboard</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="right">
      <button class="ghost small" id="themeBtn">◐ Theme</button>
      <button class="primary small" id="quickPay">+ Log payment</button>
    </div>
  </header>
  <div class="content" id="page"></div>
</main>

<dialog id="dlg">
  <form class="dlg" id="form" novalidate>
    <h2 id="dlgTitle"></h2>
    <div id="dlgFields" style="display:grid; gap:14px"></div>
    <div class="error" id="formError"></div>
    <div class="foot">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<div class="toasts" id="toasts"></div>

<script>
(() => {
  const KEY = "finance-admin-v5", PREV = ["finance-admin-v4","finance-admin-v3","admin-dashboard-v2"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const num = (v) => Number(v) || 0;
  const sum = (arr, k) => arr.reduce((s, x) => s + num(x[k]), 0);
  const today = () => new Date().toISOString().slice(0, 10);
  const COLORS = ["#6366f1","#ec4899","#f59e0b","#10b981","#06b6d4","#8b5cf6","#ef4444","#84cc16"];
  const MAX_DEBT_MONTHS = 600;

  const blank = () => ({ currency:"USD", salary:0, savingsGoal:0, savingsStart:0, horizon:12, strategy:"avalanche", debts:[], obligations:[], budget:[], payments:[], lent:[], repayments:[] });
  function load() {
    try {
      const v5 = localStorage.getItem(KEY); if (v5) return { ...blank(), ...JSON.parse(v5) };
      for (const k of PREV) {
        const raw = localStorage.getItem(k);
        if (raw) {
          const d = { ...blank(), ...JSON.parse(raw) };
          d.debts = (d.debts||[]).map((x) => ({ rate:0, ...x }));
          d.payments = d.payments || []; d.lent = d.lent || []; d.repayments = d.repayments || [];
          d.budget = (d.budget||[]).map((b) => ({ flex:"yes", ...b }));
          delete d.items;
          return d;
        }
      }
    } catch {}
    return blank();
  }
  let state = load();
  state.debts.forEach((d) => { if (d.original === undefined) d.original = num(d.owed); });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const money = (n) => { try { return new Intl.NumberFormat(undefined, { style:"currency", currency: state.currency||"USD", maximumFractionDigits:0 }).format(n||0); } catch { return (n||0).toFixed(0); } };
  const money2 = (n) => { try { return new Intl.NumberFormat(undefined, { style:"currency", currency: state.currency||"USD", maximumFractionDigits:2 }).format(n||0); } catch { return (n||0).toFixed(2); } };
  const compact = (n) => new Intl.NumberFormat(undefined, { notation:"compact", maximumFractionDigits:1 }).format(n||0);
  const monthLabel = (k) => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + k - 1, 1).toLocaleDateString(undefined, { month:"short", year:"numeric" }); };
  const initials = (s) => (String(s||"?").trim().split(/\s+/).map((w) => w[0]).join("").slice(0,2).toUpperCase()) || "?";
  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    $("toasts").appendChild(t); setTimeout(() => t.remove(), 2600);
  }

  // ==== PLANNER ====
  // Every month the plan is rebuilt from the current balances. Priority when money is short:
  //   1. Obligations (rent, bills)  2. Debt minimums  3. Essential budget
  //   4. Savings goal               5. Flexible budget (postponed to next month if short)
  //   6. Anything left goes to debts (per strategy), then to savings once debts are clear.
  function plan(s) {
    const H = Math.max(1, Math.min(60, num(s.horizon) || 12));
    const salary = num(s.salary), oblig = sum(s.obligations, "monthly");
    const cats = s.budget.map((b) => ({ id:b.id, name:b.name, limit:num(b.limit), flex: b.flex !== "no", carry:0 }));
    const debts = s.debts.filter((d) => num(d.owed) > 0).map((d) => ({
      id:d.id, name:d.name, bal:num(d.owed), apr:num(d.rate), r:num(d.rate)/1200, min:num(d.monthly), interest:0, paidOff:null, paid:0,
    }));
    const lent = (s.lent || []).filter((l) => num(l.owed) > 0).map((l) => ({ id:l.id, name:l.name, bal:num(l.owed), exp:num(l.expected) }));
    const order = s.strategy === "snowball" ? (a, b) => a.bal - b.bal : (a, b) => b.apr - a.apr || a.bal - b.bal;
    const savGoal = num(s.savingsGoal);
    let savings = num(s.savingsStart);
    const rows = [], notes = [];

    // Spread one group's payment across its categories in proportion to what each needed.
    function settle(group, need, paid) {
      for (const c of group) {
        const cNeed = c.limit + c.carry;
        const cPaid = need > 0 ? paid * cNeed / need : 0;
        c.carry = Math.max(0, cNeed - cPaid);
      }
    }

    for (let m = 1; m <= H; m++) {
      for (const d of debts) if (d.bal > 0.005) { const i = d.bal * d.r; d.bal += i; d.interest += i; }
      const row = { m, income:salary, inflow:0, oblig, minDue:0, minPaid:0, essPaid:0, savPaid:0, savAdded:0, flxPaid:0, extra:0, pay:{}, postponed:[], savShort:0, unfunded:0, over:0, savings:0, debtBal:0, status:"ok" };
      for (const l of lent) if (l.bal > 0.005) { const r = Math.min(l.exp, l.bal); l.bal -= r; row.inflow += r; }
      row.income = salary + row.inflow;
      let cash = row.income - oblig;
      if (cash < 0) { row.over = -cash; cash = 0; }

      // 2. Debt minimums (paid in list order; anything unpaid stays owed and keeps accruing interest)
      for (const d of debts) if (d.bal > 0.005) {
        const need = Math.min(d.min, d.bal);
        row.minDue += need;
        const p = Math.min(need, cash);
        cash -= p; d.bal -= p; d.paid += p; row.minPaid += p; row.pay[d.id] = p;
      }
      row.unfunded = row.minDue - row.minPaid;

      // 3. Essential budget
      const ess = cats.filter((c) => !c.flex), flx = cats.filter((c) => c.flex);
      const essNeed = ess.reduce((a, c) => a + c.limit + c.carry, 0);
      const essPaid = Math.min(cash, essNeed); cash -= essPaid; row.essPaid = essPaid;
      settle(ess, essNeed, essPaid);

      // 4. Savings goal
      const savPay = Math.min(cash, savGoal); cash -= savPay; row.savPaid = savPay; row.savShort = savGoal - savPay;

      // 5. Flexible budget
      const flxNeed = flx.reduce((a, c) => a + c.limit + c.carry, 0);
      const flxPaid = Math.min(cash, flxNeed); cash -= flxPaid; row.flxPaid = flxPaid;
      settle(flx, flxNeed, flxPaid);
      row.postponed = cats.filter((c) => c.carry > 0.005).map((c) => ({ name:c.name, amt:c.carry }));

      // 6. Leftover: debts first (per strategy), then savings
      let extra = cash;
      for (const d of debts.filter((x) => x.bal > 0.005).sort(order)) {
        if (extra <= 0) break;
        const p = Math.min(extra, d.bal);
        d.bal -= p; d.paid += p; row.pay[d.id] = (row.pay[d.id] || 0) + p; row.extra += p; extra -= p;
      }
      row.savAdded = savPay + Math.max(0, extra);
      savings += row.savAdded;

      for (const d of debts) if (d.paidOff === null && d.bal <= 0.005) { d.bal = 0; d.paidOff = m; }
      row.savings = savings;
      row.debtBal = debts.reduce((a, d) => a + d.bal, 0);
      row.debtPaid = Object.values(row.pay).reduce((a, b) => a + b, 0);

      // Status and suggestions for this month
      if (row.over > 0.005) {
        row.status = "over";
        notes.push({ m, kind:"over", text:`Obligations are ${money(row.over)} more than your income. Lower an obligation or add income. Nothing else can be funded until this is fixed.` });
      } else if (row.unfunded > 0.005) {
        row.status = "short";
        notes.push({ m, kind:"short", text:`Debt minimums are ${money(row.unfunded)} short. Pay that from savings if you can, or ask the lender to move the due date. Interest keeps growing on the unpaid part.` });
      } else if (row.postponed.length || row.savShort > 0.005) {
        row.status = "replan";
      }
      for (const p of row.postponed) notes.push({ m, kind:"postpone", text:`Postpone ${money(p.amt)} of "${p.name}" to next month.` });
      if (row.savShort > 0.005) notes.push({ m, kind:"savings", text:`Savings goal reduced by ${money(row.savShort)} this month to cover the essentials and debts.` });
      rows.push(row);
    }
    for (const l of lent) if (l.bal > 0.005 && l.exp <= 0) notes.push({ m:1, kind:"lent", text:`${l.name} owes you money but has no monthly repayment set, so it isn't in the plan. Edit it on Lent money.` });
    const cleared = debts.every((d) => d.bal <= 0.005);
    const lastPaid = Math.max(0, ...debts.map((d) => d.paidOff || 0));
    return {
      H, rows, notes, debts, cleared, lentEnd: lent.reduce((a, l) => a + l.bal, 0),
      lastPaid: cleared ? lastPaid : 0,
      endSavings: rows.length ? rows[rows.length-1].savings : num(s.savingsStart),
      endDebt: rows.length ? rows[rows.length-1].debtBal : sum(s.debts, "owed"),
      interest: debts.reduce((a, d) => a + d.interest, 0),
      minTotal: debts.reduce((a, d) => a + d.min, 0),
      oblig, budgetTotal: cats.reduce((a, c) => a + c.limit, 0),
      replanMonths: rows.filter((r) => r.status !== "ok").length,
      lentIn: rows.reduce((a, r) => a + r.inflow, 0),
      hasDebts: debts.length > 0,
    };
  }

  // ==== CHARTS ====
  function lineChart(series, labels) {
    const n = labels.length;
    if (n < 2) return '<div class="empty">Add income and debts to see the chart.</div>';
    const W = 720, H = 280, P = 52;
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const x = (i) => P + i * (W - 2*P) / (n - 1);
    const y = (v) => H - P - (v / max) * (H - 2*P);
    const lines = series.map((s) => {
      const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      return `<polyline class="line" stroke="${s.color}" points="${pts}"/>`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Debt and savings over the year">
      <line class="axis" x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}"/>
      <line class="axis" x1="${P}" y1="${P}" x2="${P}" y2="${H-P}" stroke-dasharray="3 4"/>
      <text class="tick" x="${P-8}" y="${P+4}" text-anchor="end">${esc(compact(max))}</text>
      <text class="tick" x="${P-8}" y="${H-P+4}" text-anchor="end">0</text>
      ${lines}
      <text class="tick" x="${P}" y="${H-14}">${esc(labels[0])}</text>
      <text class="tick" x="${W-P}" y="${H-14}" text-anchor="end">${esc(labels[n-1])}</text>
    </svg>
    <div class="legend">${series.map((s) => `<span><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
  }
  function bars(items) {
    const max = Math.max(...items.map((i) => Math.abs(i.value)), 1);
    return items.map((i) => `<div class="bar-row"><span>${esc(i.label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, Math.abs(i.value)/max*100)).toFixed(1)}%; background:${i.color}"></div></div>
      <span class="bar-val ${i.value < 0 ? "over" : ""}">${money(i.value)}</span></div>`).join("");
  }

  // ==== PAGES ====
  let page = "overview";

    return `<div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th class="${h.num?"num":""}">${h.t}</th>`).join("")}<th></th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;

    return `
      ${p.replanMonths ? `<div class="alert warn"><span>●</span><span class="txt">The plan changed in ${p.replanMonths} of the next ${p.H} months to fit your income. See the suggestions below, and the full table on Yearly plan.</span></div>` : ""}
      ${!state.salary ? `<div class="alert warn"><span>●</span><span class="txt">Enter your monthly income on the Income page to start planning.</span></div>` : ""}
      <div class="kpis">

        <div class="kpi"><div class="label">Owed to you</div><div class="value">${money(sum(state.lent, "owed"))}</div><div class="hint">${state.lent.length} ${state.lent.length === 1 ? "person" : "people"}, back in the plan: ${money(p.lentIn)}</div></div>
        <div class="kpi"><div class="label">Debt-free by</div><div class="value">${p.hasDebts ? (p.cleared ? esc(monthLabel(p.lastPaid)) : "Not within plan") : "—"}</div><div class="hint">${p.hasDebts ? `Interest over the plan: ${money(p.interest)}` : "No debts added"}</div></div>
      </div>

            { name:"Debt left", color:"var(--debt)", values:p.rows.map((r) => r.debtBal) },

            { label:"Essential budget", value:first.essPaid, color:"#8b5cf6" },
            { label:"Flexible budget", value:first.flxPaid, color:"#06b6d4" },

        <div class="panel-body">${notes.length ? `<div class="notes">${notes.map((n) => `<div class="note"><span class="m">${esc(monthLabel(n.m))}</span><span>${noteIcon(n.kind)} ${esc(n.text)}</span></div>`).join("")}</div>` : `<div class="empty" style="padding:12px">Nothing to postpone. Every month fits your income.</div>`}</div>

  function pagePlan() {
    const p = plan(state);

    return `
      <section class="panel"><div class="control">
        <label>Debt strategy
          <select id="strategy">
            <option value="avalanche" ${state.strategy!=="snowball"?"selected":""}>Avalanche: highest interest first</option>

      </div></section>
      ${!state.salary ? `<div class="alert warn"><span>●</span><span class="txt">Enter your income on the Income page first.</span></div>` : ""}
      ${!p.hasDebts ? `<div class="alert warn"><span>●</span><span class="txt">No debts yet. The plan still shows obligations, budget and savings.</span></div>` : ""}
      ${p.hasDebts && !p.cleared ? `<div class="alert warn"><span>●</span><span class="txt">Debts are not cleared within ${p.H} months at these payments. Extend the plan or review the amounts.</span></div>` : ""}
      <div class="kpis">
        <div class="kpi"><div class="label">Savings after ${p.H} months</div><div class="value good">${money(p.endSavings)}</div></div>
        <div class="kpi"><div class="label">Debt left after ${p.H} months</div><div class="value">${money(p.endDebt)}</div></div>
        <div class="kpi"><div class="label">Months replanned</div><div class="value ${p.replanMonths?"over":"good"}">${p.replanMonths}</div><div class="hint">Months where something was postponed or short</div></div>
      </div>
      ${p.notes.length ? `<section class="panel"><div class="panel-head"><div><h2>Replan suggestions</h2><div class="sub">Postpone these to next month</div></div></div>
        <div class="panel-body"><div class="notes">${p.notes.map((n) => `<div class="note"><span class="m">${esc(monthLabel(n.m))}</span><span>${noteIcon(n.kind)} ${esc(n.text)}</span></div>`).join("")}</div></div></section>` : ""}
      <section class="panel"><div class="panel-head"><div><h2>Month by month</h2><div class="sub">Income, fixed costs, debts and savings for each month</div></div><button class="small" id="csvBtn">Export CSV</button></div>
        ${p.rows.length ? `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` : `<div class="empty">No plan yet.</div>`}</section>
      <div class="grid2">
        <section class="panel"><div class="panel-head"><div><h2>Debt and savings</h2></div></div><div class="panel-body">${lineChart([
          { name:"Debt left", color:"var(--debt)", values:p.rows.map((r) => r.debtBal) },

        ], labels)}</div></section>
        <section class="panel"><div class="panel-head"><div><h2>Payoff by debt</h2></div></div>
          ${table([{t:"Debt"},{t:"Owed now",num:true},{t:"Paid off",num:true},{t:"Interest",num:true}], debtRows, "No debts.")}</section>
      </div>`;
  }

  function pageIncome() {
    return `<section class="panel"><div class="panel-head"><div><h2>Income · الدخل</h2><div class="sub">Used for every month in the plan</div></div></div>

      return `<div class="debt-card">
        <div class="top"><span class="name"><span class="avatar" style="background:${colors[i%colors.length]}">${initials(d.name)}</span>${esc(d.name)}</span>${actions("debts", d.id)}</div>

      { k:"owed", label:"Amount still owed to you", type:"number" },
      { k:"expected", label:"Expected monthly repayment", type:"number" },
      { k:"due", label:"Due day (1–31)", type:"number", max:31 },
      { k:"notes", label:"Notes", type:"textarea", full:true },
    ]},
    repay: { title:"money received", fields:[
      { k:"lentId", label:"From", type:"lent", req:true, full:true },
      { k:"amount", label:"Amount received", type:"number", req:true },
      { k:"date", label:"Date", type:"date", req:true },
      { k:"note", label:"Note", type:"text", full:true },
    ]},
    obligations: { title:"obligation", fields:[
      { k:"name", label:"Name (e.g. Rent, Electricity)", type:"text", req:true },
      { k:"category", label:"Category", type:"text" },
      { k:"monthly", label:"Monthly amount", type:"number" },
      { k:"due", label:"Due day (1–31)", type:"number", max:31 },
      { k:"notes", label:"Notes", type:"textarea", full:true },
    ]},
    budget: { title:"budget category", fields:[
      { k:"name", label:"Category (e.g. Groceries)", type:"text", req:true },
      { k:"limit", label:"Monthly limit", type:"number" },
      { k:"flex", label:"Can it be postponed to next month?", type:"select", options:["yes","no"], labels:{ yes:"Yes, can postpone", no:"No, essential" } },
    ]},
  };
  let editing = null;
  function openForm(list, id, preset = {}) {
    const sch = SCHEMA[list];
    const rec = id ? state[list].find((r) => r.id === id) : null;
    editing = { list, id };
    $("dlgTitle").textContent = (rec ? "Edit " : "Add ") + sch.title;
    $("formError").textContent = "";
    $("dlgFields").innerHTML = sch.fields.map((f) => {
      const v = rec ? (rec[f.k] ?? "") : (preset[f.k] ?? (f.type === "date" ? today() : (f.k === "flex" ? "yes" : "")));
      const attrs = `name="${f.k}" ${f.req ? "required" : ""}`;
      let input;
      if (f.type === "textarea") input = `<textarea ${attrs} maxlength="500">${esc(v)}</textarea>`;
      else if (f.type === "select") input = `<select ${attrs}>${f.options.map((o) => `<option value="${o}" ${o === (v || f.options[0]) ? "selected" : ""}>${f.labels ? f.labels[o] : o}</option>`).join("")}</select>`;
      else if (f.type === "lent") input = `<select ${attrs}><option value="">Choose a person…</option>${state.lent.map((l) => `<option value="${l.id}" ${l.id === v ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>`;
      else if (f.type === "debt") input = `<select ${attrs}><option value="">Choose a loan…</option>${state.debts.map((d) => `<option value="${d.id}" ${d.id === v ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select>`;
      else if (f.type === "date") input = `<input ${attrs} type="date" value="${esc(v)}">`;
      else if (f.type === "number") input = `<input ${attrs} type="number" step="0.01" min="0" ${f.max ? `max="${f.max}"` : ""} value="${esc(v)}">`;
      else input = `<input ${attrs} type="text" maxlength="120" value="${esc(v)}">`;
      return `<label class="${f.full ? "full" : ""}">${f.label}${input}</label>`;
    }).join("");
    $("dlg").showModal();
    $("form").querySelector("input,select,textarea")?.focus();
  }
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const { list, id } = editing, f = e.target, rec = {};
    for (const fd of SCHEMA[list].fields) {
      const raw = f[fd.k].value.trim();
      if (fd.req && !raw) { $("formError").textContent = fd.label + " is required."; f[fd.k].focus(); return; }
      if (fd.type === "number") {
        const n = raw === "" ? 0 : Number(raw);
        if (!Number.isFinite(n) || n < 0) { $("formError").textContent = fd.label + " must be zero or more."; return; }
        if (fd.max && n > fd.max) { $("formError").textContent = fd.label + " must be at most " + fd.max + "."; return; }
        rec[fd.k] = Math.round(n * 100) / 100;
      } else rec[fd.k] = raw;
    }
    if (list === "payments") {
      const debt = state.debts.find((d) => d.id === rec.debtId);
      if (!debt) { $("formError").textContent = "Choose a loan."; return; }
      if (rec.amount <= 0) { $("formError").textContent = "Amount must be more than zero."; return; }
      if (!id) {
        debt.owed = Math.max(0, Math.round((num(debt.owed) - rec.amount) * 100) / 100);
        state.payments.push({ id: uid(), ...rec });
        toast(`Logged. ${debt.name} now owes ${money2(debt.owed)}.`);
      } else {
        const old = state.payments.find((x) => x.id === id);
        const oldDebt = state.debts.find((d) => d.id === old.debtId);
        if (oldDebt) oldDebt.owed = Math.round((num(oldDebt.owed) + num(old.amount)) * 100) / 100;
        debt.owed = Math.max(0, Math.round((num(debt.owed) - rec.amount) * 100) / 100);
        Object.assign(old, rec);
        toast("Payment updated.");
      }
    } else if (list === "repay") {
      const person = state.lent.find((l) => l.id === rec.lentId);
      if (!person) { $("formError").textContent = "Choose a person."; return; }
      if (rec.amount <= 0) { $("formError").textContent = "Amount must be more than zero."; return; }
      person.owed = Math.max(0, Math.round((num(person.owed) - rec.amount) * 100) / 100);
      state.repayments.push({ id: uid(), ...rec });
      toast(`Logged. ${person.name} now owes you ${money2(person.owed)}.`);
    } else if (id) {
      Object.assign(state[list].find((r) => r.id === id), rec);
      toast("Saved.");
    } else {
      const item = { id: uid(), ...rec };
      if (list === "debts" || list === "lent") item.original = item.owed;
      state[list].push(item);
      toast("Added.");
    }
    save(); $("dlg").close(); render();
  };
  $("cancelBtn").onclick = () => $("dlg").close();

  // ==== EVENTS ====
  document.querySelectorAll(".nav").forEach((b) => b.onclick = () => { page = b.dataset.page; render(); window.scrollTo(0,0); });
  $("quickPay").onclick = () => state.debts.length ? openForm("payments", null) : toast("Add a loan first.");
  $("themeBtn").onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("finance-admin-theme", document.documentElement.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem("finance-admin-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

  document.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-nav]");
    if (nav) { page = nav.dataset.nav; render(); return; }
    if (e.target.closest("#logPay")) return openForm("payments", null);
    if (e.target.closest("#logRepay")) return state.lent.length ? openForm("repay", null) : toast("Add a person first.");
    const add = e.target.closest("[data-add]");
    if (add) return openForm(add.dataset.add, null);
    const ed = e.target.closest("[data-edit]");
    if (ed) { const [l, id] = ed.dataset.edit.split(":"); return openForm(l, id); }
    const del = e.target.closest("[data-del]");
    if (del) {
      const [l, id] = del.dataset.del.split(":");
      if (l === "payments") {
        const pay = state.payments.find((x) => x.id === id);
        const debt = state.debts.find((d) => d.id === pay?.debtId);
        if (pay && confirm("Delete this payment? The loan balance will go back up.")) {
          if (debt) debt.owed = Math.round((num(debt.owed) + num(pay.amount)) * 100) / 100;
          state.payments = state.payments.filter((x) => x.id !== id); save(); render(); toast("Payment deleted.");
        }
        return;
      }
      if (l === "repayments") {
        const r = state.repayments.find((x) => x.id === id);
        const person = state.lent.find((x) => x.id === r?.lentId);
        if (r && confirm("Delete this repayment? The amount owed goes back up.")) {
          if (person) person.owed = Math.round((num(person.owed) + num(r.amount)) * 100) / 100;
          state.repayments = state.repayments.filter((x) => x.id !== id); save(); render(); toast("Deleted.");
        }
        return;
      }
      const rec = state[l].find((r) => r.id === id);
      if (rec && confirm(`Delete “${rec.name}”? This can't be undone.`)) { state[l] = state[l].filter((r) => r.id !== id); save(); render(); toast("Deleted."); }
      return;
    }
    if (e.target.id === "saveIncome") {
      state.salary = Math.max(0, num($("salary").value));
      state.savingsStart = Math.max(0, num($("savStart").value));
      state.currency = ($("currency").value.trim().toUpperCase() || "USD").slice(0, 4);
      save(); render(); toast("Income saved.");
    }
    if (e.target.id === "saveSettings") {
      state.salary = Math.max(0, num($("salary2").value));
      state.currency = ($("currency").value.trim().toUpperCase() || "USD").slice(0, 4);
      save(); render(); toast("Settings saved.");
    }
    if (e.target.id === "exportBtn") download(JSON.stringify(state, null, 2), `finance-admin-${today()}.json`, "application/json");
    if (e.target.id === "importBtn") $("importFile").click();
    if (e.target.id === "resetBtn" && confirm("Erase ALL data in this browser? Export a backup first if you need it.")) { state = blank(); save(); render(); toast("All data erased."); }
    if (e.target.id === "csvBtn") {
      const p = plan(state);
      const head = ["Month","Income","Money back","Obligations","Debt minimums","Budget paid","Savings added","Extra to debts","Total to debts","Debt left","Savings total","Status","Postponed"];
      const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : (/^[=+\-@]/.test(s) ? "'" + s : s); };
      const lines = [head.map(cell).join(",")].concat(p.rows.map((r) => [
        monthLabel(r.m), r.income.toFixed(2), r.inflow.toFixed(2), r.oblig.toFixed(2), r.minDue.toFixed(2), (r.essPaid+r.flxPaid).toFixed(2),
        r.savPaid.toFixed(2), r.extra.toFixed(2), r.debtPaid.toFixed(2), r.debtBal.toFixed(2), r.savings.toFixed(2), r.status,
        r.postponed.map((x) => x.name + " " + x.amt.toFixed(2)).join("; "),
      ].map(cell).join(",")));
      download(lines.join("\r\n") + "\r\n", `yearly-plan-${today()}.csv`, "text/csv");
    }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id === "strategy") { state.strategy = e.target.value; save(); render(); return; }
    if (e.target.id === "horizon") { state.horizon = num(e.target.value); save(); render(); return; }
    if (e.target.id === "savGoal") { state.savingsGoal = Math.max(0, num(e.target.value)); save(); render(); return; }
    if (e.target.id !== "importFile") return;
    const file = e.target.files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("File must be a saved export.");
      if (!confirm("Replace all current data with this file?")) return;
      state = { ...blank(), ...d };
      for (const k of ["debts","obligations","budget","payments","lent","repayments"]) if (!Array.isArray(state[k])) state[k] = [];
      state.debts.forEach((x) => { if (x.original === undefined) x.original = num(x.owed); });
      save(); render(); toast("Imported.");
    } catch (err) { alert("Import failed: " + err.message); }
    finally { e.target.value = ""; }
  });
  function download(text, name, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  render();
})();
</script>
</body>
</html>
